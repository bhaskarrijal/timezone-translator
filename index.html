<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timezone Translator by Bhaskar Rijal</title>
    <meta
      name="description"
      content="Convert English and romanized Nepali time requests across cities and timezones."
    />
    <link rel="canonical" href="https://timezone-translator.com" />
    <meta property="og:title" content="Timezone Translator" />
    <meta
      property="og:description"
      content="Convert English and romanized Nepali time requests across cities and timezones."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Timezone Translator showing a Nepal to London time conversion" />
    <script>
      try {
        if (localStorage.getItem('timezone-theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch { /* Light mode remains the default when storage is unavailable. */ }
    </script>
    <style>
      body {
        line-height: 1.5;
        font-size: 16px;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
          "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
